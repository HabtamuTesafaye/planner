name: planner
description: "A calm planner for a two-person founding team."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Versions are pinned on purpose. Do not upgrade casually (see AGENTS.md section 3).
dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: 7.3.2
  flutter_local_notifications: 22.3.3
  flutter_riverpod: 3.4.3
  flutter_timezone: 5.1.1
  go_router: 18.1.2
  intl: 0.20.3
  material_symbols_icons: 4.2960.0
  share_plus: 13.3.1
  supabase_flutter: 2.18.3
  timezone: 0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_native_splash: 2.4.8
  mocktail: 1.0.5

flutter:
  uses-material-design: true

  # Bundled fonts (OFL). If a file is missing, Flutter falls back to the
  # system font for that family without crashing.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-400.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-500.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
